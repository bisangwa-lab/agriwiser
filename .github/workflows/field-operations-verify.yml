name: Field Operations verification

on:
  push:
    branches:
      - feat/field-operations-action-workflow-20261030
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/field-operations-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run field-work and existing tests
        run: node --test tests/*.test.js
      - name: Check lint
        run: npm run lint
      - name: Build application
        run: npm run build
